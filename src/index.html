<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit,delete,star,arrow_upward,add,assignment,close" />
    <title>Todo List</title>
</head>
<body>
    <div class="page-container">
        <div class="sidebar">
            <nav>
                <ul class="tasks-list">
                    <li id="my-day" class="sidebar-item" data-action="my-day">
                        My Day
                    </li>
                    <li id="all-tasks" class="sidebar-item" data-action="all-tasks">
                        All Tasks
                    </li>
                </ul>
                <ul class="proj-list">
                    <li class="nav-title sidebar-item"><div>My Projects</div>
                        <button data-action="add-project" id="add-project"><span class="material-symbols-outlined">add</span></button>
                    </li>
                    
                </ul>
            </nav>
        </div>
        <div class="content">

        </div>
        <dialog id="dialog">
            <form id="dialog-form">
                <button commandfor="dialog" type="button" command="close" class="material-symbols-outlined close">close</button>


            </form>
        </dialog>
    </div>
</body>
</html>
